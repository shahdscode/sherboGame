server {
    listen 80;
    listen [::]:80;
    # Temporary direct-IP entry point while public DNS is being configured.
    listen 3201;
    listen [::]:3201;
    server_name sherbogame.shiftup-solutions.com;

    root /var/www/sherbogame/current;
    index index.html;

    add_header Content-Security-Policy "frame-ancestors 'self' https://sherbeniacademy.com https://*.sherbeniacademy.com https://sherbeni-academy.shiftup-solutions.com;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://sherbeniacademy.com https://*.sherbeniacademy.com https://sherbeni-academy.shiftup-solutions.com;" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://sherbeniacademy.com https://*.sherbeniacademy.com https://sherbeni-academy.shiftup-solutions.com;" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
